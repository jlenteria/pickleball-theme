<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 18 60 60" width="128" height="128" role="img" aria-label="Two crossed pickleball paddles and a wiffle ball">
  <!-- Paddle Left -->
  <g>
    <ellipse cx="40" cy="42" fill="#ef4444" rx="14" ry="17" stroke="#ffffff" stroke-width="1.2" transform="rotate(-25 40 42)"/>
    <rect x="25" y="55" width="6" height="15" rx="3" fill="#f1f5f9" stroke="#0f172a" stroke-width="1" transform="rotate(-25 28 62)"/>
  </g>
  <!-- Paddle Right -->
  <g>
    <ellipse cx="60" cy="42" fill="#ef4444" rx="14" ry="17" stroke="#ffffff" stroke-width="1.2" transform="rotate(25 60 42)"/>
    <rect x="69" y="55" width="6" height="15" rx="3" fill="#f1f5f9" stroke="#0f172a" stroke-width="1" transform="rotate(25 72 62)"/>
  </g>
  <!-- Center wiffle ball, with holes -->
  <g>
    <circle cx="50" cy="46" r="12.5" fill="#ccff00" stroke="#ffffff" stroke-width="1.6"/>
    <circle cx="47.5" cy="43" r="1.6" fill="#203504"/>
    <circle cx="52.5" cy="43" r="1.6" fill="#203504"/>
    <circle cx="50" cy="49" r="1.6" fill="#203504"/>
    <circle cx="44.5" cy="47.5" r="1.4" fill="#203504"/>
    <circle cx="55.5" cy="47.5" r="1.4" fill="#203504"/>
  </g>
</svg>
