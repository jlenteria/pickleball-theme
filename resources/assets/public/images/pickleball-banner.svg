<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Pickleball court banner</title>
  <desc id="desc">Two crossed paddles and a wiffle ball over a lit night court, with a PICKLEBALL ribbon banner</desc>
  <defs>
    <linearGradient id="paddleRed" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="ballOptic" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5ff99"/>
      <stop offset="45%" stop-color="#ccff00"/>
      <stop offset="100%" stop-color="#8bb300"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Court texture -->
  <rect width="400" height="170" fill="#06211b"/>
  <rect x="90" y="0" width="220" height="170" fill="#0a322a" fill-opacity="0.45" stroke="#00df82" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="30" y1="85" x2="370" y2="85" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="200" y1="10" x2="200" y2="160" stroke="#ccff00" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Crossed paddles in action -->
  <g filter="url(#dropGlow)">
    <path d="M 120 40 C 145 15 190 35 180 75 C 172 108 135 110 115 88 C 100 70 102 52 120 40 Z" fill="url(#paddleRed)" stroke="#ffffff" stroke-width="4.5"/>
    <path d="M 115 88 L 88 126 C 85 130 89 135 94 133 L 126 102 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="88" y="112" width="10" height="4" fill="#ccff00" transform="rotate(-38 88 112)"/>
    <path d="M 280 40 C 255 15 210 35 220 75 C 228 108 265 110 285 88 C 300 70 298 52 280 40 Z" fill="url(#paddleRed)" stroke="#ffffff" stroke-width="4.5"/>
    <path d="M 285 88 L 312 126 C 315 130 311 135 306 133 L 274 102 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="296" y="115" width="10" height="4" fill="#ccff00" transform="rotate(38 296 115)"/>
  </g>
  <!-- Center perforated wiffle ball -->
  <g filter="url(#dropGlow)">
    <circle cx="200" cy="68" r="28" fill="url(#ballOptic)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="200" cy="50" r="3.2" fill="#2d3d04"/>
    <circle cx="184" cy="58" r="3.2" fill="#2d3d04"/>
    <circle cx="216" cy="58" r="3.2" fill="#2d3d04"/>
    <circle cx="190" cy="74" r="3.2" fill="#2d3d04"/>
    <circle cx="210" cy="74" r="3.2" fill="#2d3d04"/>
    <circle cx="200" cy="86" r="3.2" fill="#2d3d04"/>
    <circle cx="178" cy="72" r="2.8" fill="#2d3d04"/>
    <circle cx="222" cy="72" r="2.8" fill="#2d3d04"/>
    <circle cx="200" cy="68" r="3.4" fill="#3c5206"/>
  </g>
  <!-- PICKLEBALL ribbon -->
  <g filter="url(#dropGlow)">
    <path d="M 95 140 Q 200 125 305 140 L 295 158 Q 200 144 105 158 Z" fill="#04120e" stroke="#ccff00" stroke-width="2"/>
    <path d="M 103 142 Q 200 128 297 142" fill="none" stroke="#f0ff70" stroke-width="1.2"/>
    <path d="M 111 154 Q 200 142 289 154" fill="none" stroke="#f0ff70" stroke-width="1.2"/>
    <text x="200" y="148" fill="#ffffff" font-family="Outfit, sans-serif" font-size="18" font-weight="900" letter-spacing="3" text-anchor="middle">PICKLEBALL</text>
  </g>
</svg>
